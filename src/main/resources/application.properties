# --- Server ---
server.port=8080
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.html

# --- Thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- WebSocket / STOMP ---
spring.messaging.simp.broker.enabled=true
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.web.socket.sockjs=DEBUG
logging.level.org.apache.tomcat.websocket=DEBUG

# --- Datasource (PostgreSQL, кафедральный сервер pg) ---
# ЕДИНЫЙ источник настроек подключения к БД. JpaConfig берёт их отсюда через @Value.

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/studs}
spring.datasource.username=${DB_USERNAME:s465029}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-query=SELECT 1

# --- JPA / EclipseLink ---
spring.jpa.database-platform=org.eclipse.persistence.jpa.platform.PostgreSQLPlatform
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# --- Multipart ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

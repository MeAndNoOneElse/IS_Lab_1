<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{_menu :: head}">
    <title th:if="${ring.id != null}">Редактирование кольца</title>
    <title th:unless="${ring.id != null}">Создание кольца</title>
</head>
<body>
<nav th:insert="~{_menu :: nav}"></nav>
<div class="container">
    <div th:insert="~{_menu :: flash}"></div>
    <h2 th:if="${ring.id != null}">Редактирование кольца #<span th:text="${ring.id}"></span></h2>
    <h2 th:unless="${ring.id != null}">Создание кольца</h2>
    <div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}"></div>
    <form th:action="${ring.id != null ? '/rings/' + ring.id + '/edit' : '/rings/new'}" method="post" th:object="${ring}">
        <div class="form-group">
            <label>Имя <span style="color:#e74c3c;">*</span></label>
            <input type="text" th:field="*{name}" class="error" th:classappend="${#fields.hasErrors('name')} ? 'error' : ''"/>
            <div class="error-msg" th:each="err : ${#fields.errors('name')}" th:text="${err}"></div>
        </div>
        <div class="form-group">
            <label>Сила</label>
            <input type="number" th:field="*{power}" class="error" th:classappend="${#fields.hasErrors('power')} ? 'error' : ''"/>
            <div class="error-msg" th:each="err : ${#fields.errors('power')}" th:text="${err}"></div>
        </div>
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a class="btn" th:href="@{/rings}">Отмена</a>
    </form>
</div>
<script th:insert="~{_menu :: ws-client}"></script>
</body>
</html>
